name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Self-lint the manual's own docs
        run: npm run lint:self
      - name: Lint AGENTS.md (agentsmd-lint gate)
        run: node tools/agentsmd-lint/index.mjs AGENTS.md
      - name: Repo health (agents-doctor)
        run: node tools/agents-doctor/index.mjs .
      - name: Verification loop (verify-doctor)
        run: node tools/verify-doctor/index.mjs .
