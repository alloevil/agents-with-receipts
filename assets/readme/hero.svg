<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Agents with Receipts · 有据可查</title>
  <desc id="d">有据可查的 agentic coding 实践手册：左侧是项目名与一句话价值，右侧是一张列着四个板块的收据小票，盖着"有据可查"红章。</desc>

  <rect width="1200" height="360" rx="24" fill="#171512"/>

  <!-- 左：标题区 -->
  <g transform="translate(64 56)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="4" fill="#8A8378">AGENTIC CODING · EVIDENCE-FIRST</text>
    <text y="62" font-size="54" font-weight="700" fill="#F6F1E7">Agents with Receipts</text>
    <text y="104" font-size="26" fill="#D9D2C4">有据可查 —— agentic coding 实践手册</text>
    <text y="150" font-size="21" fill="#B8B0A2">每条断言都必须回答：出处在哪？</text>
    <text y="180" font-size="21" fill="#B8B0A2">答案是可以点开的官方文档，而不是口号。</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect x="0" y="212" width="230" height="40" rx="8" fill="none" stroke="#3A362F" stroke-width="1.5"/>
      <text x="18" y="238" fill="#D9D2C4">rosetta/ 跨工具对照</text>
      <rect x="246" y="212" width="220" height="40" rx="8" fill="none" stroke="#3A362F" stroke-width="1.5"/>
      <text x="264" y="238" fill="#D9D2C4">practices/ 地图</text>
      <rect x="482" y="212" width="190" height="40" rx="8" fill="none" stroke="#3A362F" stroke-width="1.5"/>
      <text x="500" y="238" fill="#D9D2C4">tools/ 三件套</text>
    </g>
    <text y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8A8378">40 verified cells · 9 chapters · 3 CLIs · MIT</text>
  </g>

  <!-- 右：收据小票（核心隐喻：每条断言都有可点开的凭据） -->
  <g transform="translate(752 18)">
    <rect x="10" y="16" width="384" height="308" fill="#000000" opacity="0.28"/>
    <path fill="#F6F1E7" d="M0,9 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 L384,315 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 Z"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#23201B">
      <text x="192" y="46" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">AGENTS WITH RECEIPTS</text>
      <text x="192" y="68" text-anchor="middle" font-size="16" fill="#6B655A">EVERY CLAIM, SOURCED</text>
      <line x1="26" y1="84" x2="358" y2="84" stroke="#23201B" stroke-width="1.5" stroke-dasharray="4 5"/>

      <g font-size="18">
        <text x="26" y="114">01 ROSETTA X-TOOL TABLE</text><text x="358" y="114" text-anchor="end">doc✓</text>
        <text x="26" y="148">02 PRACTICES MAP</text><text x="358" y="148" text-anchor="end">doc✓</text>
        <text x="26" y="182">03 LINT · DOCTOR · INIT</text><text x="358" y="182" text-anchor="end">test✓</text>
        <text x="26" y="216">04 AGENTS.MD TEMPLATES</text><text x="358" y="216" text-anchor="end">lint✓</text>
      </g>

      <line x1="26" y1="240" x2="358" y2="240" stroke="#23201B" stroke-width="1.5" stroke-dasharray="4 5"/>
      <text x="26" y="268" font-size="19" font-weight="700">TOTAL</text>
      <text x="358" y="268" text-anchor="end" font-size="19" font-weight="700">4 BOARDS · 0 SLOGANS</text>

      <!-- 条码 -->
      <g fill="#23201B" transform="translate(96 286)">
        <rect x="0" width="3" height="22"/><rect x="6" width="2" height="22"/><rect x="12" width="5" height="22"/><rect x="20" width="2" height="22"/><rect x="26" width="3" height="22"/><rect x="33" width="6" height="22"/><rect x="42" width="2" height="22"/><rect x="48" width="4" height="22"/><rect x="56" width="2" height="22"/><rect x="61" width="5" height="22"/><rect x="70" width="3" height="22"/><rect x="76" width="2" height="22"/><rect x="82" width="6" height="22"/><rect x="91" width="2" height="22"/><rect x="97" width="3" height="22"/><rect x="104" width="5" height="22"/><rect x="112" width="2" height="22"/><rect x="118" width="4" height="22"/><rect x="126" width="2" height="22"/><rect x="132" width="3" height="22"/><rect x="139" width="6" height="22"/><rect x="148" width="2" height="22"/><rect x="154" width="4" height="22"/><rect x="162" width="3" height="22"/><rect x="168" width="2" height="22"/><rect x="174" width="5" height="22"/><rect x="182" width="3" height="22"/><rect x="188" width="2" height="22"/>
      </g>
    </g>

    <!-- 红章 -->
    <g transform="translate(104 118) rotate(-9)">
      <rect x="0" y="0" width="176" height="58" rx="8" fill="none" stroke="#C0392B" stroke-width="3"/>
      <rect x="5" y="5" width="166" height="48" rx="5" fill="none" stroke="#C0392B" stroke-width="1.2" opacity="0.75"/>
      <text x="88" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#C0392B" letter-spacing="1">EVIDENCE ATTACHED</text>
      <text x="88" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#C0392B" letter-spacing="6">有据可查</text>
