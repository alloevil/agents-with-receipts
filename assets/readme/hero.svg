<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Agents with Receipts · 有据可查</title>
  <desc id="d">有据可查的 agentic coding 实践手册：左侧是项目名、两行轴归属账——rosetta/ 与 templates/ 属「读得懂」，practices/ 与 tools/ 覆盖两条轴——以及 40 sourced cells · 13 chapters · 0 dependencies 的规模数字；右侧是一张列着四个板块的收据小票，每行右侧标出凭据类型，合计 4 BOARDS · 2 AXES，盖着「有据可查」红章。</desc>

  <rect width="1200" height="360" rx="24" fill="#171512"/>

  <!-- 左：标题、两条轴的归属、规模数字 -->
  <g transform="translate(64 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="4" fill="#8A8378">AGENTIC CODING · EVIDENCE-FIRST</text>
    <text y="54" font-size="54" font-weight="700" fill="#F6F1E7">Agents with Receipts</text>
    <text y="92" font-size="26" fill="#D9D2C4">有据可查 —— agentic coding 实践手册</text>
    <text y="126" font-size="21" fill="#B8B0A2">每条断言都必须回答：出处在哪？</text>
    <text y="152" font-size="21" fill="#B8B0A2">答案是可以点开的官方文档，而不是口号。</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text y="200" fill="#D9D2C4">rosetta/ · templates/<tspan x="260" fill="#F6F1E7" font-weight="700">UNDERSTAND</tspan><tspan fill="#8A8378">读得懂</tspan></text>
      <text y="232" fill="#D9D2C4">practices/ · tools/<tspan x="260" fill="#F6F1E7" font-weight="700">UNDERSTAND + VERIFY</tspan><tspan fill="#8A8378">两条轴</tspan></text>
    </g>
    <text y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A8378">40 sourced cells · 13 chapters · 0 dependencies · MIT</text>
  </g>

  <!-- 右：收据小票（核心隐喻：每条断言都有可点开的凭据） -->
  <g transform="translate(752 18)">
    <rect x="10" y="16" width="384" height="308" fill="#000000" opacity="0.28"/>
    <path fill="#F6F1E7" d="M0,9 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 l12,-7 l12,7 L384,315 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 l-12,7 l-12,-7 Z"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#23201B">
      <text x="192" y="46" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">AGENTS WITH RECEIPTS</text>
      <text x="192" y="69" text-anchor="middle" font-size="18" fill="#6B655A">EVERY CLAIM, SOURCED</text>
      <line x1="26" y1="84" x2="358" y2="84" stroke="#23201B" stroke-width="1.5" stroke-dasharray="4 5"/>

      <g font-size="18">
        <text x="26" y="114">01 ROSETTA X-TOOL TABLE</text><text x="358" y="114" text-anchor="end">doc✓</text>
        <text x="26" y="148">02 PRACTICES MAP</text><text x="358" y="148" text-anchor="end">doc✓</text>
        <text x="26" y="182">03 TOOLBOX · 4 CLIS</text><text x="358" y="182" text-anchor="end">test✓</text>
        <text x="26" y="216">04 AGENTS.MD TEMPLATES</text><text x="358" y="216" text-anchor="end">lint✓</text>
      </g>

      <line x1="26" y1="240" x2="358" y2="240" stroke="#23201B" stroke-width="1.5" stroke-dasharray="4 5"/>
      <text x="26" y="258" font-size="19" font-weight="700">TOTAL</text>
      <text x="358" y="258" text-anchor="end" font-size="19" font-weight="700">4 BOARDS · 2 AXES</text>

      <!-- 条码 -->
      <g fill="#23201B" transform="translate(26 288)">
        <rect x="0" width="3" height="22"/><rect x="6" width="2" height="22"/><rect x="12" width="5" height="22"/><rect x="20" width="2" height="22"/><rect x="26" width="3" height="22"/><rect x="33" width="6" height="22"/><rect x="42" width="2" height="22"/><rect x="48" width="4" height="22"/><rect x="56" width="2" height="22"/><rect x="61" width="5" height="22"/><rect x="70" width="3" height="22"/><rect x="76" width="2" height="22"/><rect x="82" width="6" height="22"/><rect x="91" width="2" height="22"/>
      </g>
    </g>

    <!-- 红章 -->
    <g transform="translate(158 268)">
      <rect x="0" y="0" width="200" height="46" rx="8" fill="none" stroke="#C0392B" stroke-width="3"/>
      <rect x="4" y="4" width="192" height="38" rx="5" fill="none" stroke="#C0392B" stroke-width="1.2" opacity="0.75"/>
      <text x="100" y="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#C0392B">EVIDENCE ATTACHED</text>
      <text x="100" y="39" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="19" font-weight="700" fill="#C0392B" letter-spacing="6">有据可查</text>
    </g>
  </g>
</svg>
