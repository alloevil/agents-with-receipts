<script>
const REPO = 'https://github.com/alloevil/agents-with-receipts';

// 导航即目录：id 用文件路径，页面内容直接 fetch 仓库里的 Markdown 原文渲染，
// 内容永远和仓库单一事实源同步，页面本身零构建。
const GROUPS = [
  { label: 'START', items: [
    { no: '00', title: '这是什么', file: '_start' },
  ]},
  { label: 'ROSETTA · 对照', items: [
    { no: 'R', title: '跨工具对照表', file: 'rosetta/README.md' },
  ]},
  { label: 'PRACTICES · 实践', items: [
    { no: 'IDX', title: '章节索引', file: 'practices/README.md' },
    { no: '00', title: '从零配齐（可跟做）', file: 'practices/00-agent-ready-walkthrough.md' },
    { no: '01', title: 'Memory 文件', file: 'practices/01-memory-files.md' },
    { no: '02', title: '机制选型', file: 'practices/02-mechanism-selection.md' },
    { no: '03', title: '任务框架与规划', file: 'practices/03-task-framing.md' },
    { no: '04', title: '验证闭环', file: 'practices/04-verification.md' },
    { no: '05', title: '权限与沙箱', file: 'practices/05-permissions-sandbox.md' },
    { no: '06', title: '上下文管理', file: 'practices/06-context-management.md' },
    { no: '07', title: '并行与编排', file: 'practices/07-parallel-orchestration.md' },
    { no: '08', title: '安全与治理', file: 'practices/08-security-governance.md' },
  ]},
  { label: 'TOOLS · 工具', items: [
    { no: 'L1', title: 'agentsmd-lint 查文件', file: 'tools/agentsmd-lint/README.md' },
    { no: 'L2', title: 'agents-doctor 查仓库', file: 'tools/agents-doctor/README.md' },
    { no: 'L3', title: 'agents-init 生成起点', file: 'tools/agents-init/README.md' },
  ]},
  { label: 'TEMPLATES · 模板', items: [
    { no: 'T1', title: 'AGENTS.md 模板', file: 'templates/AGENTS.md.template', raw: true },
    { no: 'T2', title: 'RULES.md 模板', file: 'templates/RULES.md.template', raw: true },
  ]},
  { label: 'META', items: [
    { no: 'C', title: '贡献指南', file: 'CONTRIBUTING.md' },
  ]},
];

const START_HTML = `
<h1>Agents with Receipts · 有据可查</h1>
<p><strong>有据可查的 agentic coding 实践手册。</strong>每条断言都必须回答一个问题：<em>出处在哪？</em>答案是可以点开的官方文档，而不是口号。</p>
<h2>我该从哪看起？</h2>
<table>
<tr><th>你想做的事</th><th>从这里进</th></tr>
<tr><td><strong>第一次给仓库配 agent 基建</strong></td><td>跟做 <a href="#/practices/00-agent-ready-walkthrough.md">00 walkthrough</a>：AGENTS.md → 条件规则 → hook → lint 进 CI，每步可验证</td></tr>
<tr><td><strong>给仓库写一份 AGENTS.md / CLAUDE.md</strong></td><td><a href="#/templates/AGENTS.md.template">模板</a>起步，对照 <a href="#/practices/01-memory-files.md">01 Memory 文件</a>的取舍原则</td></tr>
<tr><td><strong>不知道该用 memory 还是 rule 还是 hook</strong></td><td><a href="#/practices/02-mechanism-selection.md">02 机制选型</a>：两个维度定位五种机制</td></tr>
<tr><td><strong>检查已有的 AGENTS.md 写得好不好</strong></td><td>跑 <a href="#/tools/agentsmd-lint/README.md">agentsmd-lint</a>（查文件）和 <a href="#/tools/agents-doctor/README.md">agents-doctor</a>（查整仓基建）</td></tr>
<tr><td><strong>换工具，或多工具混用</strong></td><td><a href="#/rosetta/README.md">跨工具对照表</a>：同一概念各家叫什么、放哪、就近规则差在哪</td></tr>
<tr><td><strong>系统过一遍实践全景</strong></td><td><a href="#/practices/README.md">实践地图</a>九个章节，每条实践带官方出处</td></tr>
<tr><td><strong>发现内容过期或有错</strong></td><td><a href="#/CONTRIBUTING.md">贡献指南</a>——带官方链接来提 PR，过期条目删除而非堆积</td></tr>
</table>
<h2>只有十分钟？</h2>
<p>读<a href="#/rosetta/README.md">跨工具对照表</a>的「收敛格局」和「就近规则差异」两节，然后对自己的仓库跑一次：</p>
<pre><code>git clone ${REPO}.git
node agents-with-receipts/tools/agentsmd-lint/index.mjs 你的仓库/AGENTS.md</code></pre>
<h2>核心立场</h2>
<ol>
<li><strong>证据优先。</strong>没有出处的断言不收；对照表的每一格都是官方文档链接。</li>
<li><strong>半衰期意识。</strong>这个领域几个月一变；每条标注适用工具与日期，过期即删。</li>
<li><strong>宁缺毋滥。</strong>手册的价值密度由最差的一条决定。</li>
<li><strong>可执行 &gt; 可读。</strong>能写成 lint 规则、模板、脚手架的实践，不要只写成散文。</li>
</ol>`;

const ALL = GROUPS.flatMap(g => g.items);
const byFile = Object.fromEntries(ALL.map(p => [p.file, p]));

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function currentFile() {
  const h = decodeURIComponent(location.hash.replace(/^#\//, ''));
  return byFile[h] ? h : '_start';
}

function renderNav() {
  const cur = currentFile();
  document.getElementById('nav').innerHTML = GROUPS.map(g => `
    <div class="stub-group">
      <p class="label">${g.label}</p>
      ${g.items.map(p => `<a class="stub ${p.file === cur ? 'active' : ''}" href="#/${p.file}"><span class="no">${p.no}</span><span>${p.title}</span></a>`).join('')}
    </div>`).join('');
}

// 把渲染出的站内 .md 相对链接改写成 hash 路由（跨文件目录要归一化）
function rewriteLinks(root, baseDir) {
  for (const a of root.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href');
    if (/^(https?:|#|mailto:)/.test(href)) { if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; } continue; }
    const parts = (baseDir + href).split('/').filter(x => x !== '.');
    const stack = [];
    for (const p of parts) { if (p === '..') stack.pop(); else stack.push(p); }
    let norm = stack.join('/').replace(/\/$/, '');
    const target = byFile[norm] ? norm : byFile[norm + '/README.md'] ? norm + '/README.md' : null;
    if (target) a.setAttribute('href', '#/' + target);
    else { a.setAttribute('href', REPO + '/blob/main/' + norm); a.target = '_blank'; a.rel = 'noopener'; }
  }
}

async function renderPage() {
  const file = currentFile();
  renderNav();
  const content = document.getElementById('content');
  const crumb = document.getElementById('crumb');
  const srcLink = document.getElementById('src-link');

  if (file === '_start') {
    crumb.textContent = 'RECEIPT #00 · START';
    srcLink.href = REPO;
    content.innerHTML = START_HTML;
  } else {
    const page = byFile[file];
    crumb.textContent = `RECEIPT #${page.no} · ${file}`;
    srcLink.href = `${REPO}/blob/main/${file}`;
    try {
      const resp = await fetch(file);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      if (page.raw) {
        // 模板含 <占位符>，按源码展示可整段复制
        content.innerHTML = `<h1>${esc(page.title)}</h1><p>复制后把每个占位符换成你的事实；填不出来的整节删掉，写完跑 agentsmd-lint。</p><pre><code>${esc(text)}</code></pre>`;
      } else {
        content.innerHTML = marked.parse(text);
        rewriteLinks(content, file.includes('/') ? file.slice(0, file.lastIndexOf('/') + 1) : '');
      }
    } catch (e) {
      content.innerHTML = `<h1>加载失败</h1><p>${esc(e.message)}。若在本地直接双击打开本文件，浏览器会拦截 fetch——用 <code>python3 -m http.server</code> 起个静态服务，或直接访问线上版本。</p>`;
    }
  }
  window.scrollTo({ top: 0 });
}

window.addEventListener('hashchange', renderPage);
renderPage();
</script>
